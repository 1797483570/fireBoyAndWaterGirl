name: validate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/**'
      - 'saves/progress.json'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python 语法
        run: python -m py_compile tools/serve.py tools/mirror.py tools/check_case.py

      - name: 存档 JSON 合法性
        run: |
          python - <<'PY'
          import json
          d = json.load(open('saves/progress.json', encoding='utf-8'))
          assert isinstance(d.get('saves'), dict), 'saves 字段必须是对象'
          print('seasons:', len(d['saves']))
          PY

      - name: 静态托管路径大小写一致性
        run: python tools/check_case.py

      - name: 大厅不得请求外部资源（离线可用）
        run: |
          set -e
          if grep -nE "https?://" index.html | grep -vE "data:image|xmlns"; then
            echo "::error file=index.html::出现了外部 URL，会破坏离线可用性"
            exit 1
          fi
          echo "no external requests"

      - name: 镜像文件完整性（关卡 JSON 抽样）
        run: |
          set -e
          total=$(find games -path "*/levels/*.json" | wc -l)
          echo "level files: $total"
          test "$total" -ge 290
